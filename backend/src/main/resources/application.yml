spring:
  application:
    name: moodfit
  datasource:
    url: jdbc:mysql://localhost:3306/moodfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: moodfit
    password: moodfit
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080
